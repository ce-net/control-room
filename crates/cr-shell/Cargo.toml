[package]
name = "cr-shell"
version = "0.1.0"
description = "The cr.shell cell: a signed-in person's browser grant attenuated to their control-room role, the panels it can use, the shell's page and its socket"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cr-shell-api = { path = "../cr-shell-api" }
cr-view = { path = "../cr-view" }
ce-wire = { workspace = true, features = ["server", "blocking"] }
ce-gate = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
