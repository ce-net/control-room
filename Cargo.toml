[workspace]
resolver = "2"
members = ["crates/cr-view", "crates/cr-shell-api", "crates/cr-shell", "crates/cr-keys-api", "crates/cr-devices-api", "crates/cr-audit-api"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ce-wire = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "7083669b3240dce8dbc66142d7c9e127fab4aedf", default-features = false, features = ["codec"] }
ce-gate = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "7083669b3240dce8dbc66142d7c9e127fab4aedf" }

[profile.release]
lto = "thin"
codegen-units = 16
