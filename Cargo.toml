[workspace]
resolver = "2"
members = ["crates/cr-shell-api", "crates/cr-shell", "crates/control-room-policy", "crates/control-room-site"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ce-wire = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "2aede6d81d2d856d1d17b383624dfd19ce6aeba9" }
ce-gate = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "2aede6d81d2d856d1d17b383624dfd19ce6aeba9" }
ui-part = { git = "https://github.com/ce-net/ui-cells", rev = "12b36bc5e02f139858c9cc90fff0c7b4f58ab9a3" }
ui-chain = { git = "https://github.com/ce-net/ui-cells", rev = "12b36bc5e02f139858c9cc90fff0c7b4f58ab9a3" }
ui-manifest = { git = "https://github.com/ce-net/ui-cells", rev = "12b36bc5e02f139858c9cc90fff0c7b4f58ab9a3" }
site-gateway = { git = "https://github.com/ce-net/ui-cells", rev = "12b36bc5e02f139858c9cc90fff0c7b4f58ab9a3" }
# the slot cells, pinned by commit: this is the site's cell.lock (a source contract that changes under the pin does
# not build here until the pin moves)
cr-keys-api = { git = "https://github.com/ce-net/cr-keys", rev = "8da837d331027f69d17167751b33c827848d826a" }
cr-devices-api = { git = "https://github.com/ce-net/cr-devices", rev = "17ac14cc23c2dc4ae0142ac8e1145f2ee9901684" }
cr-audit-api = { git = "https://github.com/ce-net/cr-audit", rev = "80e7b6274ff601d84c7b4af41cb6675336d7b2d0" }

[profile.release]
lto = "thin"
codegen-units = 16
